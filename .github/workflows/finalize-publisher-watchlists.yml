name: Finalize publisher watchlists

on:
  push:
    branches:
      - feature/publisher-watchlists
    paths:
      - scripts/finalize-publisher-watchlists.py
      - .github/workflows/finalize-publisher-watchlists.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feature/publisher-watchlists
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Apply compatibility migration
        run: python3 scripts/finalize-publisher-watchlists.py

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify extension and tests
        run: npm test

      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: finalize configurable publisher watchlists"
          git push origin HEAD:feature/publisher-watchlists
