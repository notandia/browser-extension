name: Generate Notandia brand assets

on:
  push:
    branches:
      - brand/notandia-identity
    paths:
      - .github/workflows/generate-brand-assets.yml
      - scripts/generate-brand-assets.py
      - docs/brand/notandia-symbol.svg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: brand/notandia-identity
          persist-credentials: true

      - name: Install Inter and vector dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-inter fontconfig libcairo2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked-purpose generators
        run: python -m pip install --disable-pip-version-check "cairosvg==2.7.1" "fonttools==4.59.0" "pillow==11.3.0"

      - name: Generate vectors and PNG exports
        run: python scripts/generate-brand-assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git add docs/brand icons store/assets
          if git diff --cached --quiet; then
            echo "Brand assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "brand: generate Notandia vector and raster assets"
          git push origin HEAD:brand/notandia-identity
