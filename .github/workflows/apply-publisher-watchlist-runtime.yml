name: Apply publisher watchlist runtime refactor

on:
  push:
    branches:
      - feature/configurable-publisher-watchlists
    paths:
      - scripts/apply-publisher-watchlist-runtime.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feature/configurable-publisher-watchlists
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Apply deterministic refactor
        run: node scripts/apply-publisher-watchlist-runtime.js
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run extension verification and tests
        run: npm test
      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git add background.js content/content_script.js shared/integrity.js tests/integrity.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: integrate configurable publisher watchlists"
          git push origin HEAD:feature/configurable-publisher-watchlists
